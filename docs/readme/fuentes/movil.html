<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Creabel en el móvil</title>
<style>
  html, body { margin: 0; background: transparent; }
  body { display: flex; gap: 56px; justify-content: center; align-items: flex-start; padding: 24px 28px; }
  .phone { width: 412px; padding: 14px; border-radius: 46px; background: #1b2329; box-shadow: 0 18px 40px rgba(16, 28, 38, .28), inset 0 0 0 2px #36424b; }
  .screen { position: relative; width: 412px; height: 892px; border-radius: 34px; overflow: hidden; background: #e6e9eb; }
  .status { height: 34px; background: #222e36; color: #e8edf0; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font: 600 13px 'Segoe UI', system-ui, sans-serif; }
  .status svg { display: block; }
  iframe { width: 412px; height: 858px; border: 0; display: block; }
  .notch { position: absolute; top: 11px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #0d1216; }
</style>
</head>
<body>
<script>
// Dos teléfonos con la aplicación de Android: ?lang=es&a=home&b=scene:sc2
// El segundo se carga cuando el primero ha creado el proyecto de ejemplo (comparten datos).
const Q = new URLSearchParams(location.search);
const lang = Q.get('lang') || 'es';
const tema = Q.get('tema') || 'light';
const frames = [Q.get('a') || 'home', Q.get('b') || 'scene:sc2'].map((go, i) => {
  const phone = document.createElement('div');
  phone.className = 'phone';
  phone.innerHTML = '<div class="screen"><div class="status"><span>9:41</span><span class="notch"></span>'
    + '<svg width="44" height="12" viewBox="0 0 44 12" fill="#e8edf0"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="2" width="3" height="10"/><rect x="20" y="1" width="20" height="10" rx="2" fill="none" stroke="#e8edf0" stroke-width="1.4"/><rect x="22" y="3" width="13" height="6" rx="1"/><rect x="41" y="4" width="2" height="4"/></svg>'
    + '</div><iframe></iframe></div>';
  document.body.append(phone);
  const frame = phone.querySelector('iframe');
  frame.dataset.src = `_prueba-capturas.html?android&lang=${lang}&tema=${tema}&go=${encodeURIComponent(go)}${i === 0 ? '&nuevo' : ''}`;
  return frame;
});
frames[0].src = frames[0].dataset.src;
const next = setInterval(() => {
  try {
    if (frames[0].contentDocument.documentElement.dataset.captura === 'lista') {
      clearInterval(next);
      frames[1].src = frames[1].dataset.src;
    }
  } catch (err) { /* todavía cargando */ }
}, 100);
</script>
</body>
</html>
