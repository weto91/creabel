<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creabel</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
<script>
// Aplica el tema guardado antes de pintar, para evitar el parpadeo claro/oscuro.
try {
  var ui = JSON.parse(localStorage.getItem('creabel.ui') || '{}');
  var theme = ui.theme || 'system';
  if (theme === 'system') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
} catch (e) {}
</script>
</head>
<body>
<div id="app"><div class="boot">Creabel…</div></div>
<noscript><p style="padding:2rem;font-family:sans-serif">Creabel necesita JavaScript para funcionar.</p></noscript>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
